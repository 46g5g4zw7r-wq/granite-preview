<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад камня — заставка</title>
<style>
:root{
  --gold:#b38d4f;--gold-deep:#8a6a2e;--ink:#f5f1ea;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#15171a;color:var(--ink);overflow:hidden}
.scene{position:fixed;inset:0;overflow:hidden}

/* Фоновые фото: медленно сменяют друг друга */
.slide{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transform:scale(1.02);animation:cycle 40s linear infinite;will-change:opacity,transform}
.slide.b1{background-image:url(img/s1.jpg);animation-delay:0s}
.slide.b2{background-image:url(img/s2.jpg);animation-delay:-5s}
.slide.b3{background-image:url(img/s3.jpg);animation-delay:-10s}
.slide.b4{background-image:url(img/s4.jpg);animation-delay:-15s}
.slide.b5{background-image:url(img/s5.jpg);animation-delay:-20s}
.slide.b6{background-image:url(img/s6.jpg);animation-delay:-25s}
.slide.b7{background-image:url(img/s7.jpg);animation-delay:-30s}
.slide.b8{background-image:url(img/s8.jpg);animation-delay:-35s}
@keyframes cycle{
  0%{opacity:0;transform:scale(1.02)}
  4%{opacity:1}
  16%{opacity:1}
  21%,100%{opacity:0;transform:scale(1.12)}
}

/* Переливание: тёплая вуаль, которая плывёт */
.wash{position:absolute;inset:-20%;background:
  radial-gradient(40% 35% at 30% 30%, rgba(179,141,79,.28), transparent 70%),
  radial-gradient(45% 40% at 75% 70%, rgba(138,106,46,.22), transparent 70%),
  radial-gradient(35% 30% at 60% 20%, rgba(245,241,234,.14), transparent 70%);
  animation:wash 16s ease-in-out infinite alternate;mix-blend-mode:screen;pointer-events:none}
@keyframes wash{0%{transform:translate(-6%,-4%) rotate(0deg)}100%{transform:translate(6%,5%) rotate(6deg)}}

/* Блик по всему экрану */
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.14) 50%,transparent 58%);transform:translateX(-100%);animation:sweep 9s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}

.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,17,.5),rgba(14,15,17,.1) 45%,rgba(14,15,17,.7));pointer-events:none}

/* 3D-пространство для плашек */
.space{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 45%;z-index:2;pointer-events:none}

/* Плашка: внешний слой задаёт место и наклон, внутренний (.flip) крутится */
.float{position:absolute;left:0;top:0;width:clamp(90px,11vw,170px);aspect-ratio:3/4;transform-style:preserve-3d;will-change:transform;pointer-events:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.float.dragging{cursor:grabbing}
.flip{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;border-radius:16px;overflow:hidden;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 60px -10px rgba(0,0,0,.6);backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none}
.face.back{transform:rotateY(180deg)}
.face::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 35%,transparent 70%,rgba(0,0,0,.25));pointer-events:none}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(-120%);animation:sheenCard 4.6s ease-in-out infinite;pointer-events:none}
.float:nth-child(2n) .face::after{animation-delay:1.3s}.float:nth-child(3n) .face::after{animation-delay:2.4s}.float:nth-child(5n) .face::after{animation-delay:3.1s}
@keyframes sheenCard{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}

/* Бегущая строка внизу */
.band{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;pointer-events:none;perspective:900px;perspective-origin:50% 60%;overflow:hidden;background:linear-gradient(180deg,rgba(14,15,17,0),rgba(14,15,17,.85) 45%);border-top:1px solid rgba(255,255,255,.12)}
.track{position:absolute;left:0;top:16px;white-space:nowrap;font-family:Manrope,Inter,system-ui,sans-serif;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.8rem;color:rgba(231,220,198,.5);animation:marquee 32s linear infinite;will-change:transform;pointer-events:none}
.track span{display:inline-block;padding-right:3em}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Плашка, которая пролетает по строке; её можно поймать и вытащить вверх */
.fly{position:absolute;left:0;bottom:18px;width:clamp(70px,7vw,104px);aspect-ratio:3/4;transform-style:preserve-3d;animation-name:fly;animation-timing-function:linear;animation-fill-mode:forwards;will-change:transform;pointer-events:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.fly-in{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 3s linear infinite;will-change:transform}
.fly .card{position:absolute;inset:0;border-radius:12px;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.25);box-shadow:0 14px 30px rgba(0,0,0,.6);backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none}
.fly .card.back{transform:rotateY(180deg)}
@keyframes fly{
  0%{transform:translate3d(108vw,0,-160px) rotateX(12deg)}
  50%{transform:translate3d(46vw,-22px,160px) rotateX(-8deg)}
  100%{transform:translate3d(-150px,0,-40px) rotateX(10deg)}
}
@keyframes spin{to{transform:rotateY(360deg)}}

/* Текст и переключатель */
.lang{position:absolute;top:18px;right:18px;display:flex;gap:6px;z-index:3;background:rgba(14,15,17,.35);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px;backdrop-filter:blur(6px)}
.lang button{font:inherit;font-size:.82rem;font-weight:700;letter-spacing:.06em;color:#e7dcc6;background:transparent;border:0;border-radius:999px;padding:7px 13px;cursor:pointer;transition:background .25s,color .25s}
.lang button:hover{background:rgba(255,255,255,.08)}
.lang button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#fff}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;z-index:2;pointer-events:none}
.title{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(2.8rem,9vw,6.8rem);letter-spacing:.06em;margin:0;display:flex;flex-wrap:wrap;justify-content:center;color:#fff;transform-style:preserve-3d;transform:none;animation:none;text-shadow:0 1px 0 #e9dcc0,0 2px 0 #d6c39c,0 3px 0 #bfa675,0 4px 0 #a88c5a,0 5px 0 #8f7347,0 6px 0 #775d37}
@keyframes sway{0%,100%{transform:perspective(900px) rotateX(14deg) rotateY(-7deg)}50%{transform:perspective(900px) rotateX(10deg) rotateY(7deg)}}
.center::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 48% 32% at 50% 46%,rgba(14,15,17,.62),transparent 72%);pointer-events:none;z-index:-1}
.title span{display:inline-block;opacity:0;transform:translateY(.4em);animation:letter 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.2s + var(--i) * 70ms)}
.title span.sp{width:.35em}
@keyframes letter{to{opacity:1;transform:none}}
.tag{margin:0;font-size:clamp(.95rem,2vw,1.2rem);color:#fff;letter-spacing:.08em;text-transform:uppercase;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.7);animation:fade 1.2s ease 1.5s forwards}
@keyframes fade{to{opacity:1}}
.line{width:min(340px,70vw);height:2px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;opacity:0;animation:fade .8s ease 1.9s forwards}
.line i{display:block;height:100%;width:45%;background:linear-gradient(90deg,transparent,var(--gold),#e6cf9c,var(--gold-deep));animation:load 2.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(230%)}}
.hint{position:absolute;left:0;right:0;bottom:176px;text-align:center;font-size:.85rem;color:rgba(231,220,198,.8);letter-spacing:.04em;z-index:3;pointer-events:none;opacity:0;animation:fade 1.2s ease 2.4s forwards}

/* Плашки внизу: больше зона захвата, подсветка при наведении */
.fly::before{content:"";position:absolute;inset:-14px;border-radius:24px}
.fly:hover .card{box-shadow:0 0 0 2px rgba(255,230,170,.75),0 14px 34px rgba(0,0,0,.6),0 0 26px rgba(255,220,150,.35)}

/* Рука-указатель: открытая ладонь при наведении, кулак при нажатии, вспышка при вытаскивании */
.hand{position:fixed;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;background:radial-gradient(circle,rgba(255,240,205,.45),rgba(255,240,205,.08) 70%);border:2px solid rgba(255,230,170,.8);box-shadow:0 0 22px rgba(255,220,150,.45);pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s,background .18s;z-index:9999}
.hand.show{opacity:1;transform:scale(1)}
.hand.press{transform:scale(.82);background:radial-gradient(circle,rgba(255,220,150,.75),rgba(255,220,150,.18) 70%)}
.hand::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,230,170,.9);opacity:0;pointer-events:none}
.hand.pulse::after{animation:ring .7s ease-out}
@keyframes ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(2.2)}}

/* Вход */
.enter{pointer-events:auto;font:inherit;font-weight:700;font-size:1rem;letter-spacing:.06em;color:#fff;background:linear-gradient(180deg,var(--gold),var(--gold-deep));border:1px solid var(--gold-deep);border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s,filter .15s}
.enter:hover{filter:brightness(1.08);transform:translateY(-1px)}
.enter[hidden]{display:none}
.login{pointer-events:auto;display:none;position:relative;width:min(370px,88vw);padding:24px;border-radius:22px;text-align:left;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 60%,rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);box-shadow:0 40px 80px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);overflow:hidden;transform-style:preserve-3d;transform-origin:50% 100%;will-change:transform,opacity}
.login.open{display:block;animation:enter3d 1s cubic-bezier(.2,.8,.2,1) both}
.login::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-120%);animation:glassSheen 5s ease-in-out 1s infinite;pointer-events:none}
@keyframes glassSheen{0%{transform:translateX(-120%)}40%,100%{transform:translateX(120%)}}
@keyframes enter3d{
  0%{opacity:0;transform:perspective(1000px) translateZ(-260px) rotateX(-68deg) rotateY(14deg) translateY(-40px) scale(.9)}
  55%{opacity:1}
  100%{opacity:1;transform:perspective(1000px) translateZ(0) rotateX(0) rotateY(0) translateY(0) scale(1)}
}
.login h2{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:1.25rem;margin:0 0 14px;color:#fff;letter-spacing:.02em}
.login label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:#e7dcc6;font-weight:600}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0;font:inherit;font-size:1rem;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:11px 12px;outline:none;backdrop-filter:blur(6px)}
.pwrow input:focus{border-color:var(--gold-light);box-shadow:0 0 0 3px rgba(179,141,79,.25)}
.lbtn{font:inherit;font-size:.85rem;font-weight:600;color:#e7dcc6;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:0 12px;cursor:pointer}
.lbtn:hover{background:rgba(255,255,255,.14)}
.err{min-height:1.2em;margin:10px 0 0;font-size:.85rem;color:#f0b9a8}
.btns{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btns .lbtn{padding:10px 16px}
.gold{font:inherit;font-weight:700;color:#fff;background:linear-gradient(180deg,var(--gold),var(--gold-deep));border:1px solid var(--gold-deep);border-radius:10px;padding:10px 22px;cursor:pointer}
.gold:hover{filter:brightness(1.08)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.demo{margin:12px 0 0;font-size:.75rem;color:rgba(231,220,198,.6)}
.login input.fld{font:inherit;font-size:1rem;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:11px 12px;outline:none;width:100%;backdrop-filter:blur(6px)}
.login input.fld:focus{border-color:var(--gold-light);box-shadow:0 0 0 3px rgba(179,141,79,.25)}
.login label{margin-bottom:12px}
.forgot{margin:-2px 0 0;text-align:right}
.linkbtn{font:inherit;font-size:.82rem;color:#e7dcc6;background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:#fff}

.ctitle{font-size:clamp(2.2rem,7.4vw,4.6rem);letter-spacing:.12em;margin-top:-4px;font-weight:800;color:#d8453a;transform:none;animation:none;text-shadow:0 1px 0 #e8786e,0 2px 0 #b8362b,0 3px 0 #922b21,0 4px 0 #6e2019}
.ctitle[hidden]{display:none}

@media (max-width:640px){ .float{width:72px} .fly{width:60px} }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important}
  .slide.b1{opacity:1}
  .title span,.tag,.line,.hint{opacity:1;transform:none;filter:none}
  .fly{display:none}
}
</style>
</head>
<body>
<main class="scene" aria-label="Заставка Склад камня">
  <div class="slide b1"></div><div class="slide b2"></div><div class="slide b3"></div><div class="slide b4"></div>
  <div class="slide b5"></div><div class="slide b6"></div><div class="slide b7"></div><div class="slide b8"></div>
  <div class="wash"></div>
  <div class="sheen"></div>
  <div class="shade"></div>

  <div class="space" id="space">
    <div class="float"><div class="flip">
      <div class="face front" style="background-image:url(img/s1.jpg)"></div>
      <div class="face back"></div>
    </div></div>
    <div class="float"><div class="flip">
      <div class="face front" style="background-image:url(img/s2.jpg)"></div>
      <div class="face back"></div>
    </div></div>
    <div class="float"><div class="flip">
      <div class="face front" style="background-image:url(img/s3.jpg)"></div>
      <div class="face back"></div>
    </div></div>
    <div class="float"><div class="flip">
      <div class="face front" style="background-image:url(img/s4.jpg)"></div>
      <div class="face back"></div>
    </div></div>
    <div class="float"><div class="flip">
      <div class="face front" style="background-image:url(img/s5.jpg)"></div>
      <div class="face back"></div>
    </div></div>
    <div class="float"><div class="flip">
      <div class="face front" style="background-image:url(img/s6.jpg)"></div>
      <div class="face back"></div>
    </div></div>
    <div class="float"><div class="flip">
      <div class="face front" style="background-image:url(img/s7.jpg)"></div>
      <div class="face back"></div>
    </div></div>
    <div class="float"><div class="flip">
      <div class="face front" style="background-image:url(img/s8.jpg)"></div>
      <div class="face back"></div>
    </div></div>
  </div>

  <!-- бегущая строка: плашки пролетают поверх неё -->
  <div class="band" id="band">
    <div class="track" id="track"></div>
  </div>

  <div class="hand" id="hand" aria-hidden="true"><span id="handIcon">🖐️</span></div>
  <nav class="lang" aria-label="Язык">
    <button type="button" data-lang="ru" aria-pressed="true">RU</button>
    <button type="button" data-lang="fr" aria-pressed="false">FR</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="es" aria-pressed="false">ES</button>
  </nav>

  <div class="center">
    <h1 class="title" id="title"></h1>
    <h2 class="title ctitle" id="companyTitle" hidden></h2>
    <p class="tag" id="tag"></p>
    <div class="line"><i></i></div>
    <button type="button" class="enter" id="enterBtn">Войти</button>
    <button type="button" class="linkbtn" id="demoBtn" style="pointer-events:auto;font-size:.9rem"></button>
    <section class="login" id="login" role="dialog" aria-labelledby="loginTitle" aria-modal="false">
      <form id="loginForm" autocomplete="off">
        <h2 id="loginTitle">Вход</h2>
        <label for="email"><span id="emailLabel">E-mail</span>
          <input id="email" name="email" type="email" autocomplete="username" class="fld">
        </label>
        <label for="pw"><span id="pwLabel">Пароль</span>
          <span class="pwrow">
            <input id="pw" name="pw" type="password" autocomplete="off">
            <button type="button" class="lbtn" id="showPw">Показать</button>
          </span>
        </label>
        <p class="forgot"><button type="button" class="linkbtn" id="forgotBtn">Забыли пароль?</button></p>
        <p class="err" id="err" role="alert"></p>
        <div class="btns">
          <button type="button" class="lbtn" id="cancelBtn">Назад</button>
          <button type="submit" class="gold" id="submitBtn">Войти</button>
        </div>
        <p class="demo" id="demoNote"></p>
      </form>
    </section>
  </div>
  <p class="hint" id="hint"></p>
</main>

<script>
(function () {
  var PHOTOS = [1,2,3,4,5,6,7,8].map(function (n) { return "url(img/s" + n + ".jpg)"; });
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var space = document.getElementById("space");
  var band = document.getElementById("band");
  var track = document.getElementById("track");

  var W = window.innerWidth, H = window.innerHeight;
  var topZ = 2000;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pickOther(exclude) {
    var c; do { c = PHOTOS[Math.floor(Math.random() * PHOTOS.length)]; } while (exclude.indexOf(c) !== -1);
    return c;
  }

  /* Путь плашки по экрану: несколько синусов разной частоты */
  function pathAt(s, t) {
    var nx = 0.5 + 0.36 * Math.sin(t * s.fx1 + s.px1) + 0.14 * Math.sin(t * s.fx2 + s.px2);
    var ny = 0.5 + 0.34 * Math.sin(t * s.fy1 + s.py1) + 0.12 * Math.sin(t * s.fy2 + s.py2);
    var nz = Math.sin(t * s.fz + s.pz);
    return { x: nx * W, y: ny * H, nz: nz };
  }

  function newParams() {
    return {
      fx1: rnd(0.11, 0.26), fx2: rnd(0.05, 0.13), px1: rnd(0, 6.28), px2: rnd(0, 6.28),
      fy1: rnd(0.09, 0.22), fy2: rnd(0.04, 0.12), py1: rnd(0, 6.28), py2: rnd(0, 6.28),
      fz: rnd(0.07, 0.18), pz: rnd(0, 6.28), depth: rnd(260, 420),
      fr: rnd(0.12, 0.25), pr: rnd(0, 6.28),
      rate: rnd(1 / 18, 1 / 8), off: rnd(0, 360)
    };
  }

  /* Превращает элемент .float в управляемую плашку: мышь ловит её и двигает */
  var state = [];
  function makePlate(el, params) {
    var flip = el.querySelector(".flip");
    var back = el.querySelector(".face.back");
    var front = el.querySelector(".face.front");
    var s = Object.assign(params, {
      el: el, flip: flip, back: back, front: front,
      w: 0, h: 0, turns: -1,
      baseX: 0, baseY: 0, ox: 0, oy: 0, vx: 0, vy: 0,
      spin: 0, spinTarget: 0, drag: null, zBoost: 0
    });

    el.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 && e.pointerType === "mouse") return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      var cx = s.baseX + s.ox, cy = s.baseY + s.oy;
      s.drag = {
        id: e.pointerId,
        gx: e.clientX - cx, gy: e.clientY - cy,
        x0: e.clientX, y0: e.clientY, t0: performance.now(),
        lastX: e.clientX, lastY: e.clientY, lastT: performance.now()
      };
      s.vx = 0; s.vy = 0;
      topZ += 1; s.zBoost = topZ;
      el.classList.add("dragging");
    });

    el.addEventListener("pointermove", function (e) {
      var d = s.drag;
      if (!d || e.pointerId !== d.id) return;
      var now = performance.now();
      var dx = e.clientX - d.lastX, dy = e.clientY - d.lastY;
      s.ox = (e.clientX - d.gx) - s.baseX;
      s.oy = (e.clientY - d.gy) - s.baseY;
      s.spin += dx * 0.6;
      s.spinTarget = s.spin;
      s.vx = now - d.lastT > 80 ? 0 : dx;
      s.vy = now - d.lastT > 80 ? 0 : dy;
      d.lastX = e.clientX; d.lastY = e.clientY; d.lastT = now;
    });

    function endDrag(e) {
      var d = s.drag;
      if (!d || e.pointerId !== d.id) return;
      var dt = performance.now() - d.t0;
      var dist = Math.hypot(e.clientX - d.x0, e.clientY - d.y0);
      if (dist < 6 && dt < 350) { s.spinTarget = s.spin + 180; }
      s.drag = null;
      el.classList.remove("dragging");
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);

    state.push(s);
    return s;
  }

  // Начальные плашки на главном экране
  Array.prototype.slice.call(space.querySelectorAll(".float")).forEach(function (el) {
    var back = el.querySelector(".face.back");
    var front = el.querySelector(".face.front");
    back.style.backgroundImage = pickOther([front.style.backgroundImage]);
    makePlate(el, newParams());
  });

  function measure() {
    W = window.innerWidth; H = window.innerHeight;
    state.forEach(function (s) { s.w = s.el.offsetWidth; s.h = s.el.offsetHeight; });
  }

  function frame(ms) {
    var t = ms / 1000;
    state.forEach(function (s) {
      var p = pathAt(s, t);
      var z = p.nz * s.depth;
      s.baseX = p.x;
      s.baseY = p.y;
      var scale = 1 + p.nz * 0.18;

      if (!s.drag) {
        s.ox += s.vx; s.oy += s.vy;
        s.vx *= 0.93; s.vy *= 0.93;
        s.spin += (s.spinTarget - s.spin) * 0.12;
      }
      var cx = Math.min(W, Math.max(0, s.baseX + s.ox));
      var cy = Math.min(H, Math.max(0, s.baseY + s.oy));
      s.ox = cx - s.baseX; s.oy = cy - s.baseY;

      var rx = 22 * Math.sin(t * s.fr + s.pr);
      var rz = 10 * Math.sin(t * s.fr * 0.6 + s.pr * 2);
      var angle = t * s.rate * 360 + s.off;
      var turns = Math.floor(angle / 360);
      if (turns !== s.turns) {
        s.turns = turns;
        if (turns > 0) {
          s.back.style.backgroundImage = pickOther([s.front.style.backgroundImage, s.back.style.backgroundImage]);
        }
      }

      s.el.style.transform =
        "translate3d(" + (cx - s.w / 2).toFixed(1) + "px," + (cy - s.h / 2).toFixed(1) + "px," + z.toFixed(1) + "px) " +
        "rotateX(" + rx.toFixed(1) + "deg) rotateZ(" + rz.toFixed(1) + "deg) " +
        "scale(" + scale.toFixed(3) + ")";
      s.flip.style.transform = "rotateY(" + (angle + s.spin).toFixed(1) + "deg)";
      s.el.style.zIndex = s.drag || s.zBoost ? String(s.zBoost || topZ) : String(Math.round(z + 1000));
      s.el.style.opacity = String(0.82 + 0.18 * (p.nz + 1) / 2);
    });
    if (!reduce) requestAnimationFrame(frame);
  }

  window.addEventListener("resize", measure);
  measure();
  if (reduce) {
    state.forEach(function (s, i) {
      var cols = 4, col = i % cols, row = Math.floor(i / cols);
      var x = (0.15 + col * 0.23) * W, y = (0.3 + row * 0.4) * H;
      s.el.style.transform = "translate3d(" + (x - s.w / 2) + "px," + (y - s.h / 2) + "px,0)";
    });
  } else {
    requestAnimationFrame(frame);
  }

  /* ---------- Плашка из нижней строки: тянешь вверх — становится обычной ---------- */
  function promoteFlyer(flyer, e) {
    var r = flyer.getBoundingClientRect();
    var cxScreen = r.left + r.width / 2, cyScreen = r.top + r.height / 2;
    var frontImg = flyer.querySelector(".card.front").style.backgroundImage;
    var backImg = flyer.querySelector(".card.back").style.backgroundImage;

    var el = document.createElement("div");
    el.className = "float";
    el.innerHTML = '<div class="flip"><div class="face front"></div><div class="face back"></div></div>';
    el.querySelector(".face.front").style.backgroundImage = frontImg;
    el.querySelector(".face.back").style.backgroundImage = backImg;
    space.appendChild(el);

    var params = newParams();
    var s = makePlate(el, params);
    s.w = el.offsetWidth; s.h = el.offsetHeight;
    var t = performance.now() / 1000;
    var p = pathAt(s, t);
    // Плашка появляется ровно там, где была в строке
    s.ox = cxScreen - p.x; s.oy = cyScreen - p.y;
    s.baseX = p.x; s.baseY = p.y;

    // Сразу начинаем тянуть её мышкой
    el.setPointerCapture(e.pointerId);
    s.drag = {
      id: e.pointerId,
      gx: e.clientX - cxScreen, gy: e.clientY - cyScreen,
      x0: e.clientX, y0: e.clientY, t0: performance.now(),
      lastX: e.clientX, lastY: e.clientY, lastT: performance.now()
    };
    topZ += 1; s.zBoost = topZ;
    el.classList.add("dragging");
    flyer.remove();
    if (window.pulseHand) window.pulseHand(cxScreen, cyScreen);
  }

  /* ---------- Бегущая строка: плашки пролетают по одной ---------- */
  function spawnFlyer() {
    var el = document.createElement("div");
    el.className = "fly";
    el.style.animationDuration = rnd(7, 11).toFixed(1) + "s";
    var inner = document.createElement("div");
    inner.className = "fly-in";
    inner.style.animationDuration = rnd(2.5, 5).toFixed(1) + "s";
    inner.style.animationDelay = rnd(0, 2).toFixed(1) + "s";
    var front = document.createElement("div");
    front.className = "card front";
    var frontImg = pickOther([]);
    front.style.backgroundImage = frontImg;
    var back = document.createElement("div");
    back.className = "card back";
    back.style.backgroundImage = pickOther([frontImg]);
    inner.appendChild(front);
    inner.appendChild(back);
    el.appendChild(inner);
    band.appendChild(el);

    var pending = null;
    el.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 && e.pointerType === "mouse") return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      pending = { id: e.pointerId, y0: e.clientY };
    });
    el.addEventListener("pointermove", function (e) {
      if (!pending || e.pointerId !== pending.id) return;
      // Потянули вверх больше чем на 14 пикселей — плашка вылетает в главное поле
      if (pending.y0 - e.clientY > 14) {
        var p = pending; pending = null;
        promoteFlyer(el, e);
      }
    });
    function clearPending() { pending = null; }
    el.addEventListener("pointerup", clearPending);
    el.addEventListener("pointercancel", clearPending);

    el.addEventListener("animationend", function (e) {
      if (e.animationName === "fly" && el.parentNode) el.remove();
    });
  }

  function flyerLoop() {
    spawnFlyer();
    setTimeout(flyerLoop, rnd(900, 1800));
  }
  if (!reduce) {
    spawnFlyer();
    setTimeout(spawnFlyer, 700);
    setTimeout(flyerLoop, 1400);
  }

  /* ---------- Рука-указатель ---------- */
  (function () {
    var hand = document.getElementById("hand");
    var icon = document.getElementById("handIcon");
    var hovering = false, pressed = false;

    function place(x, y) { hand.style.left = x + "px"; hand.style.top = y + "px"; }
    function refresh() {
      hand.classList.toggle("show", hovering || pressed);
      hand.classList.toggle("press", pressed);
      icon.textContent = pressed ? "✊" : "🖐️";
    }
    function grabbable(t) { return !!(t && t.closest && t.closest(".fly, .float")); }

    document.addEventListener("pointermove", function (e) { place(e.clientX, e.clientY); });
    document.addEventListener("pointerover", function (e) { hovering = grabbable(e.target); refresh(); });
    document.addEventListener("pointerout", function (e) {
      if (grabbable(e.target) && !grabbable(e.relatedTarget)) { hovering = false; refresh(); }
    });
    document.addEventListener("pointerdown", function (e) {
      if (grabbable(e.target)) { pressed = true; place(e.clientX, e.clientY); refresh(); }
    });
    function release() { pressed = false; refresh(); }
    document.addEventListener("pointerup", release);
    document.addEventListener("pointercancel", release);

    // Вспышка, когда плашка вытащена из строки
    window.pulseHand = function (x, y) {
      hand.classList.remove("pulse");
      void hand.offsetWidth;
      place(x, y);
      hand.classList.add("pulse");
    };
  })();

  /* ---------- Окно входа (превью: пароль никуда не отправляется и не сохраняется) ---------- */
  var LOGIN = {
    ru: { enter: "Войти", title: "Вход", pw: "Пароль", show: "Показать", hide: "Скрыть", back: "Назад", submit: "Войти",
          email: "E-mail", emailEmpty: "Введите e-mail.", emailBad: "Проверьте e-mail: в нём похоже ошибка.",
          forgotNote: "Превью: письмо для сброса пароля не отправляется.",
          empty: "Введите пароль.", wrong: "Пароль не подошёл. Попробуйте ещё раз.",
          demo: "Превью: проверка пароля ещё не подключена.", forgot: "Забыли пароль?" },
    fr: { enter: "Se connecter", title: "Connexion", pw: "Mot de passe", show: "Afficher", hide: "Masquer", back: "Retour", submit: "Se connecter",
          email: "E-mail", emailEmpty: "Saisissez votre e-mail.", emailBad: "Vérifiez l’e-mail : il semble contenir une erreur.",
          forgotNote: "Aperçu : l’e-mail de réinitialisation n’est pas envoyé.",
          empty: "Saisissez le mot de passe.", wrong: "Mot de passe incorrect. Réessayez.",
          demo: "Aperçu : la vérification du mot de passe n’est pas encore branchée.", forgot: "Mot de passe oublié ?" },
    en: { enter: "Sign in", title: "Sign in", pw: "Password", show: "Show", hide: "Hide", back: "Back", submit: "Sign in",
          email: "E-mail", emailEmpty: "Enter your e-mail.", emailBad: "Check the e-mail: it looks wrong.",
          forgotNote: "Preview: the reset e-mail is not sent.",
          empty: "Enter the password.", wrong: "Wrong password. Try again.",
          demo: "Preview: password check is not connected yet.", forgot: "Forgot password?" }
  };
  var enterBtn = document.getElementById("enterBtn");
  var demoBtn = document.getElementById("demoBtn");
  demoBtn.addEventListener("click", function () { window.location.href = "app.html"; });
  var loginBox = document.getElementById("login");
  var loginForm = document.getElementById("loginForm");
  var pwInput = document.getElementById("pw");
  var showBtn = document.getElementById("showPw");
  var cancelBtn = document.getElementById("cancelBtn");
  var submitBtn = document.getElementById("submitBtn");
  var errEl = document.getElementById("err");
  var currentLang = "ru";

  function applyLogin(code) {
    currentLang = LOGIN[code] ? code : "ru";
    var L = LOGIN[currentLang];
    enterBtn.textContent = L.enter;
    var company = getCompany();
    document.getElementById("loginTitle").textContent = company ? L.title + " · " + company : L.title;
    document.getElementById("pwLabel").textContent = L.pw;
    showBtn.textContent = pwInput.type === "text" ? L.hide : L.show;
    cancelBtn.textContent = L.back;
    submitBtn.textContent = L.submit;
    document.getElementById("demoNote").textContent = L.demo;
    document.getElementById("emailLabel").textContent = L.email;
    document.getElementById("forgotBtn").textContent = L.forgot || "Забыли пароль?";
    errEl.textContent = "";
  }

  function openLogin() {
    loginBox.classList.add("open");
    enterBtn.hidden = true;
    demoBtn.hidden = true;
    setTimeout(function () { pwInput.focus(); }, 60);
  }
  function closeLogin() {
    loginBox.classList.remove("open");
    enterBtn.hidden = false;
    demoBtn.hidden = false;
    pwInput.value = "";
    pwInput.type = "password";
    applyLogin(currentLang);
  }

  enterBtn.addEventListener("click", openLogin);
  cancelBtn.addEventListener("click", closeLogin);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && loginBox.classList.contains("open")) closeLogin();
  });
  showBtn.addEventListener("click", function () {
    pwInput.type = pwInput.type === "password" ? "text" : "password";
    showBtn.textContent = pwInput.type === "text" ? LOGIN[currentLang].hide : LOGIN[currentLang].show;
    pwInput.focus();
  });
  document.getElementById("forgotBtn").addEventListener("click", function () {
    errEl.textContent = LOGIN[currentLang].forgotNote;
  });
  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var L = LOGIN[currentLang];
    // Пароль здесь не проверяется и никуда не уходит: это превью интерфейса
    var mail = document.getElementById("email").value.trim();
    if (!mail) { errEl.textContent = L.emailEmpty; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { errEl.textContent = L.emailBad; }
    else if (!pwInput.value) { errEl.textContent = L.empty; }
    else {
      // Превью: проверки пароля нет, при корректном e-mail открываем экран склада
      window.location.href = "app.html";
      return;
    }
    loginBox.classList.remove("shake");
    void loginBox.offsetWidth;
    loginBox.classList.add("shake");
    pwInput.focus();
  });

  /* ---------- Язык ---------- */
  var DICT = {
    ru: {
      title: "Склад камня", tag: "Остатки гранита и кварца",
      hint: "Поймай плашку мышкой · тяни, крути, нажми — перевернётся · тяни снизу вверх — вылетит",
      ticker: "Склад камня · Гранит · Кварц · Остатки · Приход · Журнал",
      demo: "Посмотреть склад без входа"
    },
    fr: {
      title: "Entrepôt de pierre", tag: "Stock de granit et de quartz",
      hint: "Attrapez une plaque · glissez, tournez, cliquez — elle se retourne · tirez vers le haut depuis le bas — elle s’envole",
      ticker: "Entrepôt de pierre · Granit · Quartz · Stock · Entrées · Journal",
      demo: "Voir l’entrepôt sans se connecter"
    },
    en: {
      title: "Stone Warehouse", tag: "Granite and quartz inventory",
      hint: "Grab a slab · drag, spin, click — it flips · pull it up from the strip — it flies out",
      ticker: "Stone Warehouse · Granite · Quartz · Stock · Intake · Journal",
      demo: "View the warehouse without signing in"
    }
  };
  var titleEl = document.getElementById("title");
  var tagEl = document.getElementById("tag");
  var hintEl = document.getElementById("hint");
  var buttons = document.querySelectorAll(".lang button");

  function renderTitle(text, el) {
    el = el || titleEl;
    el.setAttribute("aria-label", text);
    el.innerHTML = "";
    var i = 0;
    Array.prototype.forEach.call(text, function (ch) {
      var s = document.createElement("span");
      if (ch === " ") { s.className = "sp"; }
      else { s.textContent = ch; }
      s.style.setProperty("--i", i++);
      el.appendChild(s);
    });
  }

  function renderTicker(text) {
    var group = "";
    for (var k = 0; k < 4; k++) { group += "<span>" + text + "</span>"; }
    track.innerHTML = group + group;
  }

  function setLang(code) {
    if (!DICT[code]) code = "ru";
    document.documentElement.lang = code;
    renderTitle(DICT[code].title);
    tagEl.textContent = DICT[code].tag;
    hintEl.textContent = DICT[code].hint;
    renderTicker(DICT[code].ticker);
    demoBtn.textContent = DICT[code].demo;
    applyLogin(code);
    Array.prototype.forEach.call(buttons, function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === code));
    });
    try { localStorage.setItem("granite.lang", code); } catch (e) { /* хранилище недоступно */ }
  }

  Array.prototype.forEach.call(buttons, function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });

  /* ---------- Испанский ---------- */
  LOGIN.es = { enter: "Entrar", title: "Acceso", pw: "Contraseña", show: "Mostrar", hide: "Ocultar", back: "Atrás", submit: "Entrar",
    email: "E-mail", emailEmpty: "Introduzca el e-mail.", emailBad: "Revise el e-mail: parece que hay un error.",
    forgot: "¿Olvidó la contraseña?", forgotNote: "Vista previa: el correo para restablecer la contraseña no se envía.",
    empty: "Introduzca la contraseña.", wrong: "La contraseña no coincide. Inténtelo de nuevo.",
    demo: "Vista previa: la comprobación de la contraseña aún no está conectada." };
  DICT.es = { title: "Almacén de piedra", tag: "Inventario de granito y cuarzo",
    hint: "Atrape una placa · arrastre, gire, pulse: se da la vuelta · tire hacia arriba desde la franja: sale volando",
    ticker: "Almacén de piedra · Granito · Cuarzo · Existencias · Entradas · Diario",
    demo: "Ver el almacén sin entrar" };

  var saved = null;
  try { saved = localStorage.getItem("granite.lang"); } catch (e) { saved = null; }
  setLang(saved || "ru");

  /* Название компании, заданное в админке (тот же браузер) */
  function getCompany() {
    var DEFAULT_CO = "Rocartz";
    try { return localStorage.getItem("granite.company") || DEFAULT_CO; } catch (e) { return DEFAULT_CO; }
  }
  var companyEl = document.getElementById("companyTitle");
  var company = getCompany();
  companyEl.hidden = !company;
  if (company) renderTitle(company, companyEl);
  applyLogin(currentLang);
})();
</script>
