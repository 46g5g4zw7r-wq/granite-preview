<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад камня — остатки</title>
<style>
:root{
  --granite-900:#1b1c1f;--granite-800:#232528;--granite-700:#34363b;
  --quartz-50:#fbf9f5;--quartz-100:#f5f1ea;--quartz-300:#d8cfc0;
  --gold:#8a6a2e;--gold-deep:#7a5b22;--gold-light:#b38d4f;--line:#e4dfd6;--ink:#161a20;--ink-soft:#4b5361;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--quartz-100);color:var(--ink)}
h1,h2,h3{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:750;letter-spacing:-.01em;color:var(--granite-800);margin:0}

/* Шапка */
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:linear-gradient(180deg,var(--granite-700),var(--granite-800));color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.brand{font-family:Manrope,Inter,sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:.03em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#f5f1ea,#b38d4f 60%,#7a5b22)}
.role{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(179,141,79,.25);color:#f3e3bd;border:1px solid rgba(179,141,79,.5)}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:.78rem;font-weight:700;color:#d8d2c4;background:transparent;border:0;border-radius:999px;padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#fff}
.logout{font:inherit;font-size:.85rem;color:#d8d2c4;text-decoration:none;padding:6px 10px;border-radius:10px}
.logout:hover{background:rgba(255,255,255,.08);color:#fff}

/* Вкладки */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 18px 0;background:var(--granite-800)}
.tab{font:inherit;font-weight:600;color:#c9cdd4;background:transparent;border:0;padding:10px 14px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab[aria-selected="true"]{color:#fff;background:var(--quartz-100);box-shadow:inset 0 -3px 0 var(--gold-light)}

main{padding:20px 18px 40px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Показатели */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:var(--quartz-50);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(21,24,29,.06),0 6px 18px rgba(21,24,29,.06)}
.kpi b{display:block;font-family:Manrope,Inter,sans-serif;font-size:1.9rem;font-weight:800;color:var(--granite-800)}
.kpi span{font-size:.85rem;color:var(--ink-soft)}
.kpi.warn b{color:#8a4b0e}

/* Панель поиска */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;font:inherit;font-size:1rem;padding:12px 14px;border:1px solid #cfc8bb;border-radius:12px;background:#fff;outline:none}
.search:focus{border-color:var(--gold-light);box-shadow:0 0 0 3px rgba(179,141,79,.22)}
.btn{font:inherit;font-weight:600;padding:12px 16px;border-radius:12px;border:1px solid #cfc8bb;background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--quartz-100)}
.btn.gold{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#fff;border-color:var(--gold-deep);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.gold:hover{filter:brightness(1.06)}

/* Сетка остатков */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;perspective:1000px}
.card{position:relative;background:var(--quartz-50);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(21,24,29,.06),0 10px 24px rgba(21,24,29,.1);transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease,box-shadow .25s ease;animation:cardIn .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.card:hover{box-shadow:0 2px 4px rgba(21,24,29,.08),0 22px 40px rgba(21,24,29,.22)}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) rotateX(-60deg) translateY(30px)}to{opacity:1;transform:perspective(900px) rotateX(0) translateY(0)}}
.ph{position:relative;height:150px;background-size:cover;background-position:center}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 4.8s ease-in-out infinite;animation-delay:var(--d,0ms)}
@keyframes sheen{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.body h3{font-size:1.02rem}
.meta{margin:0;font-size:.82rem;color:var(--ink-soft)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700}
.st-ok{background:#dcefe5;color:#1f6b4a}
.st-low{background:#f7e3c4;color:#7a4b0e}
.st-hold{background:var(--quartz-300);color:var(--granite-800)}
.actions{display:flex;gap:6px}
.sm{font:inherit;font-size:.8rem;font-weight:600;padding:6px 10px;border-radius:9px;border:1px solid #cfc8bb;background:#fff;color:var(--ink);cursor:pointer}
.sm:hover{background:var(--quartz-100)}
.sample{font-size:.8rem;color:var(--ink-soft);margin:0}

.found{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--quartz-50);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.found[hidden]{display:none}
.found img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.found p{margin:0;flex:1;font-weight:600;color:var(--granite-800);min-width:180px}
.measure{background:var(--quartz-50);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px;max-width:460px}
.measure[hidden]{display:none}
.measure h3{font-size:1.1rem}
.measure label{display:grid;gap:6px;font-size:.88rem;font-weight:600;color:var(--ink-soft)}
.measure input{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid #cfc8bb;border-radius:10px;background:#fff}
.mnote{margin:0;font-size:.85rem;color:var(--ink-soft)}
.merr{margin:0;min-height:1.2em;font-size:.85rem;color:#9a3b1e}
.mbtns{display:flex;justify-content:flex-end;gap:8px}
.theme{font:inherit;font-size:1.05rem;line-height:1;color:#e7dcc6;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;cursor:pointer}
.theme:hover{background:rgba(255,255,255,.08)}

/* Тёмная тема: переопределяем цвета на уровне html[data-theme="dark"] */
html[data-theme="dark"]{--quartz-50:#202226;--quartz-100:#15171a;--quartz-300:#3a3c42;--line:#34363b;--ink:#ece6da;--ink-soft:#b3b8c2;color-scheme:dark}
html[data-theme="dark"] body{background:#15171a;color:#ece6da}
html[data-theme="dark"] h1,html[data-theme="dark"] h2,html[data-theme="dark"] h3{color:#f3eee3}
html[data-theme="dark"] .tab[aria-selected="true"]{background:#15171a;color:#fff}
html[data-theme="dark"] .kpi b{color:#e6c98f}
html[data-theme="dark"] .kpi.warn b{color:#f0a860}
html[data-theme="dark"] .search,html[data-theme="dark"] .measure input{background:#1c1e22;color:#ece6da;border-color:#3d4047}
html[data-theme="dark"] .btn,html[data-theme="dark"] .sm{background:#24262b;color:#ece6da;border-color:#3d4047}
html[data-theme="dark"] .btn:hover,html[data-theme="dark"] .sm:hover{background:#2c2f35}
html[data-theme="dark"] .btn.gold{color:#fff}
html[data-theme="dark"] .st-ok{background:#1d3a2c;color:#8fd5b0}
html[data-theme="dark"] .st-low{background:#4a3416;color:#f2c98a}
html[data-theme="dark"] .st-hold{background:#3a3c42;color:#e6e0d4}
html[data-theme="dark"] .found p{color:#f3eee3}
html[data-theme="dark"] .merr{color:#f0a98f}
html[data-theme="dark"] .card,html[data-theme="dark"] .kpi,html[data-theme="dark"] .found,html[data-theme="dark"] .measure{background:var(--quartz-50);border-color:var(--line)}

.off{display:none!important}
.view{display:flex;flex-direction:column;gap:14px}
.view-title{font-family:Manrope,Inter,sans-serif;font-size:1.25rem;font-weight:800;color:var(--granite-800);margin:0}
.tbl{background:var(--quartz-50);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(21,24,29,.06),0 6px 18px rgba(21,24,29,.06)}
.tbl-row{display:grid;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.tbl-row:first-child{border-top:0}
.tbl-row.head{background:var(--quartz-100);font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.tbl-row span{font-size:.92rem;min-width:0;overflow-wrap:anywhere}
html[data-theme="dark"] .tbl-row.head{background:#1c1e22}
@media (max-width:640px){ .tbl-row{font-size:.85rem;padding:10px 12px} }
button.role{font:inherit;cursor:pointer}
.seg{display:inline-flex;gap:4px;align-self:flex-start;flex-wrap:wrap;background:var(--quartz-100);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{font:inherit;font-weight:600;font-size:.9rem;color:var(--ink-soft);background:transparent;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#fff}
html[data-theme="dark"] .seg{background:#1c1e22}
.rhint{font-size:.78rem;color:#d8d2c4;font-weight:500}
.companybox{display:grid;gap:8px;background:var(--quartz-50);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.companybox[hidden]{display:none}
.companybox .addform{border-style:solid;padding:10px}
.measure label[hidden]{display:none}
.qr{margin:8px 0 2px}
.qr canvas,.qr img{display:block;border-radius:6px;background:#fff;padding:4px}
.cands{display:flex;gap:10px;flex-wrap:wrap}
.cands:empty{display:none}
.cand{width:92px;font:inherit;font-size:.78rem;color:var(--ink-soft);border:2px solid #cfc8bb;border-radius:12px;background:#fff;padding:5px;cursor:pointer;text-align:center}
.cand:hover,.cand:focus-visible{border-color:var(--gold-light,#b38d4f)}
.cand i{display:block;height:64px;border-radius:8px;background-size:cover;background-position:center;margin-bottom:4px}
.adminnote{margin:0;font-size:.85rem;font-weight:600;color:#7a4b0e;background:#f7e3c4;border-radius:12px;padding:10px 14px}
html[data-theme="dark"] .adminnote{background:#4a3416;color:#f2c98a}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr)) auto;gap:8px;align-items:center;background:var(--quartz-50);border:1px dashed #cfc8bb;border-radius:16px;padding:12px}
.addform input{font:inherit;font-size:.92rem;padding:10px 12px;border:1px solid #cfc8bb;border-radius:10px;background:#fff;color:var(--ink);min-width:0}
html[data-theme="dark"] .addform input{background:#1c1e22;color:#ece6da;border-color:#3d4047}
html[data-theme="dark"] .addform{border-color:#3d4047}
@media (max-width:640px){ .kpis{grid-template-columns:1fr 1fr 1fr} .kpi b{font-size:1.4rem} .kpi span{font-size:.74rem} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
/* Объёмные кнопки: видно, куда нажимать. Светлая и тёмная тема */
.btn,.sm,.seg button{position:relative;border-radius:12px;background:linear-gradient(180deg,#ffffff,#e6e0d4);color:#2a2620;border:1px solid #c9c1b1;box-shadow:0 6px 0 #b9b09c,0 12px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;cursor:pointer;overflow:hidden}
.btn::after,.sm::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:hover,.sm:hover,.seg button:hover{transform:translateY(-2px);box-shadow:0 8px 0 #b9b09c,0 16px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.95)}
.btn:active,.sm:active,.seg button:active{transform:translateY(4px);box-shadow:0 2px 0 #b9b09c,inset 0 2px 5px rgba(0,0,0,.18)}
.btn.gold{background:linear-gradient(180deg,#d9b276,#a87f3a);color:#fff;border-color:#8a6a2e;box-shadow:0 6px 0 #6f5322,0 12px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.gold:hover{box-shadow:0 8px 0 #6f5322,0 16px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.gold:active{box-shadow:0 2px 0 #6f5322,inset 0 2px 5px rgba(0,0,0,.25)}
html[data-theme="dark"] .btn,html[data-theme="dark"] .sm,html[data-theme="dark"] .seg button{background:linear-gradient(180deg,#3d4046,#24262b);color:#ece6da;border-color:#15171a;box-shadow:0 6px 0 #101114,0 12px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
/* Цвет при нажатии: пока палец на кнопке, она меняет цвет; отпустили — возвращается */
.btn:active,.sm:active,.seg button:active{background:linear-gradient(180deg,#f2d49b,#d4a25c);color:#2a1d07;border-color:#a87f3a;transition:transform .05s ease,background .05s ease}
.btn.gold:active{background:linear-gradient(180deg,#f7e2b0,#e0b06a);color:#2a1d07;border-color:#c09048}
html[data-theme="dark"] .btn:active,html[data-theme="dark"] .sm:active,html[data-theme="dark"] .seg button:active{background:linear-gradient(180deg,#8a6a2e,#5c4620);color:#fff3d6;border-color:#c09048}
html[data-theme="dark"] .btn.gold:active{background:linear-gradient(180deg,#c9a062,#8a6a2e);color:#fff}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>
<body>

<header class="top">
  <div class="brand"><i></i><span id="brand">Склад камня</span><button type="button" class="role" id="role" title="Переключить роль (превью)">Офис</button>
    <span class="rhint" id="roleHint"></span></div>
  <div class="right">
    <nav class="lang" aria-label="Язык">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </nav>
    <button type="button" class="theme" id="themeBtn" aria-label="Тема" title="Тема"></button>
    <a class="logout" href="index.html" id="logout">Выйти</a>
  </div>
</header>

<nav class="tabs" role="tablist" id="tabs"></nav>

<main>
  <section class="companybox" id="companyBox" hidden></section>
  <section class="kpis" id="kpis"></section>

  <section class="toolbar">
    <input class="search" id="search" type="search" placeholder="Поиск по названию или ячейке">
    <button type="button" class="btn" id="scan">Сканировать код</button>
    <button type="button" class="btn" id="camBtn">Камера</button>
    <button type="button" class="btn" id="galBtn">Галерея</button>
    <input type="file" id="photoCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="photoGal" accept="image/*" hidden>
    <button type="button" class="btn" id="measureBtn">Измерить</button>
    <a class="btn" id="printBtn" href="print.html" target="_blank" rel="noopener"></a>
    <button type="button" class="btn gold" id="add">+ Добавить</button>
  </section>

  <nav class="seg" id="formSeg" aria-label="Тип">
    <button type="button" data-form="all" aria-pressed="true">Все</button>
    <button type="button" data-form="slab" aria-pressed="false">Целые плиты</button>
    <button type="button" data-form="rest" aria-pressed="false">Остатки</button>
  </nav>
  <section class="found" id="found" hidden>
    <img id="foundThumb" alt="">
    <p id="foundText"></p>
    <button type="button" class="btn" id="foundReset">Сбросить</button>
  </section>
  <section class="measure gate" id="gate" hidden>
    <h3 id="gTitle"></h3>
    <p class="mnote" id="gNote"></p>
    <label><span id="gPwl"></span><input id="gPw" type="password" autocomplete="new-password"></label>
    <label id="gPw2wrap" hidden><span id="gPw2l"></span><input id="gPw2" type="password" autocomplete="new-password"></label>
    <p class="merr" id="gErr" role="alert"></p>
    <div class="mbtns">
      <button type="button" class="btn" id="gCancel"></button>
      <button type="button" class="btn gold" id="gOk"></button>
    </div>
  </section>
  <section class="measure" id="itemForm" hidden>
    <h3 id="iTitle"></h3>
    <p class="mnote" id="iNote"></p>
    <label><span id="iCodeL"></span><input id="iCode" type="text" autocomplete="off"></label>
    <label><span id="iNameL"></span><input id="iName" type="text" autocomplete="off"></label>
    <label><span id="iKindL"></span><select id="iKind"></select></label>
    <label><span id="iCellL"></span><input id="iCell" type="text" autocomplete="off" placeholder="A-01"></label>
    <label><span id="iWL"></span><input id="iW" type="number" min="0.1" step="0.1" inputmode="decimal"></label>
    <label><span id="iHL"></span><input id="iH" type="number" min="0.1" step="0.1" inputmode="decimal"></label>
    <label><span id="iFormL"></span><select id="iForm"></select></label>
    <label><span id="iPhL"></span><input id="iPh" type="file" accept="image/*" capture="environment"></label>
    <button type="button" class="btn" id="iFind"></button>
    <div class="cands" id="iCands"></div>
    <p class="merr" id="iErr" role="alert"></p>
    <div class="mbtns">
      <button type="button" class="btn" id="iCancel"></button>
      <button type="button" class="btn gold" id="iOk"></button>
    </div>
  </section>
  <section class="measure" id="pickForm" hidden>
    <h3 id="pkTitle"></h3>
    <p class="mnote" id="pkNote"></p>
    <label id="pkTextWrap"><span id="pkLabel"></span><input id="pkText" type="text" autocomplete="off"></label>
    <label id="pkSelWrap"><span id="pkSelLabel"></span><select id="pkSelect"></select></label>
    <p class="merr" id="pkErr" role="alert"></p>
    <div class="mbtns">
      <button type="button" class="btn" id="pkCancel"></button>
      <button type="button" class="btn gold" id="pkOk"></button>
    </div>
  </section>
  <section class="measure" id="measure" hidden>
    <h3 id="mTitle"></h3>
    <p class="mnote" id="mNote"></p>
    <p class="mnote"><a href="print.html" id="printLink" target="_blank" rel="noopener"></a></p>
    <label><span id="mWl"></span><input id="mW" type="number" min="1" step="1" inputmode="numeric"></label>
    <label><span id="mHl"></span><input id="mH" type="number" min="1" step="1" inputmode="numeric"></label>
    <p class="merr" id="mErr" role="alert"></p>
    <div class="mbtns">
      <button type="button" class="btn" id="mCancel"></button>
      <button type="button" class="btn gold" id="mOk"></button>
    </div>
  </section>
  <section class="grid" id="grid" aria-live="polite"></section>
  <p class="sample" id="sample"></p>
  <section class="view off" id="view" aria-live="polite"></section>
</main>

<script>
(function () {
  var DICT = {
    ru: {
      brand: "Склад камня", role: "Офис", logout: "Выйти",
      tabs: ["Остатки", "Приход", "Журнал", "Заказы", "Персонал", "Каталог"],
      kpi: ["Плит на складе", "Мало на складе", "Приход сегодня"],
      search: "Поиск по названию или ячейке", scan: "Сканировать код", add: "+ Добавить",
      st: { ok: "в наличии", low: "мало", hold: "в резерве", cut: "в распиле" },
      kind: { quartz: "кварц", granite: "гранит" },

  /* ---------- Поиск по фото: сравнение цвета и рисунка в браузере ---------- */
  var sigCache = {};
  function loadImg(src) {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = reject;
      im.src = src;
    });
  }
  function grid4(img) {
    var c = document.createElement("canvas");
    c.width = 32; c.height = 32;
    var g = c.getContext("2d");
    g.drawImage(img, 0, 0, 32, 32);
    var d = g.getImageData(0, 0, 32, 32).data;
    var out = [];
    for (var gy = 0; gy < 4; gy++) {
      for (var gx = 0; gx < 4; gx++) {
        var r = 0, gg = 0, b = 0, n = 0;
        for (var y = gy * 8; y < gy * 8 + 8; y++) {
          for (var x = gx * 8; x < gx * 8 + 8; x++) {
            var k = (y * 32 + x) * 4;
            r += d[k]; gg += d[k + 1]; b += d[k + 2]; n++;
          }
        }
        out.push(r / n, gg / n, b / n);
      }
    }
    return out;
  }
  function signature(src) {
    if (sigCache[src]) return Promise.resolve(sigCache[src]);
    return loadImg(src).then(function (img) {
      var v = grid4(img);
      sigCache[src] = v;
      return v;
    });
  }
  function dist(a, b) {
    var s = 0;
    for (var i = 0; i < a.length; i++) { var d = a[i] - b[i]; s += d * d; }

  }

  // Кнопка «Сканировать код» с телефона: фото этикетки. Штрих-код и QR читаем, если браузер умеет
  function readCodeFromImage(img) {
    function viaDetector() {
      try {
        if (!("BarcodeDetector" in window)) return Promise.resolve("");
        var det = new BarcodeDetector({ formats: ["qr_code", "code_128", "ean_13", "ean_8", "code_39", "upc_a"] });
        return det.detect(img).then(function (rs) { return rs[0] ? String(rs[0].rawValue).trim() : ""; }).catch(function () { return ""; });
      } catch (e) { return Promise.resolve(""); }

  VIEWS.es = ES_VIEWS;

  // Образцы из таблиц убраны: приход и журнал заполняются только работниками
  [1, 2, 3].forEach(function (i) {
    ["ru", "fr", "en", "es"].forEach(function (l) { if (VIEWS[l] && VIEWS[l][i]) VIEWS[l][i].rows = []; });
  });
  renderStatic();
  renderGrid();
})();
</script>
