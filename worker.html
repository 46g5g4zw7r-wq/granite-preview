<script>
// Отметка работы — только для цеха (и админа). Вход теперь на главной.
(function () {
  if (!window.SlabAuth || !window.SlabAuth.can("shop")) { document.documentElement.style.display = "none"; location.replace("index.html"); }

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отметка работы</title>
<style>
:root{
  --granite-900:#15171a;--granite-800:#1f2226;--line:#34363b;--ink:#ece6da;--ink-soft:#b3b8c2;
  --gold:#b38d4f;--gold-deep:#8a6a2e;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--granite-900);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--granite-800);border-bottom:1px solid var(--line)}
h1{font-family:Manrope,Inter,sans-serif;font-weight:800;font-size:1.05rem;margin:0;color:#f3eee3}
.hright{display:flex;gap:8px;align-items:center}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:.78rem;font-weight:700;color:#d8d2c4;background:transparent;border:0;border-radius:999px;padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#fff}
.back{font:inherit;font-size:.85rem;color:#d8d2c4;background:transparent;border:0;padding:6px 10px;border-radius:10px;cursor:pointer;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}
.card{background:#1c1e22;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:Manrope,Inter,sans-serif;font-size:1.2rem;margin:0;color:#f3eee3}
.card label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600;color:var(--ink-soft)}
.card input{font:inherit;font-size:1.05rem;padding:13px 14px;border-radius:14px;border:1px solid #3d4047;background:#15171a;color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:1rem;padding:14px 18px;border-radius:14px;border:0;color:#fff;background:linear-gradient(180deg,var(--gold),var(--gold-deep));cursor:pointer}
.who{display:flex;flex-direction:column;gap:4px;padding:6px 2px}
.who b{font-family:Manrope,Inter,sans-serif;font-size:1.6rem;color:#f3eee3}
.who span{font-size:1.05rem;color:#e6c98f;font-weight:600}
.bigbtn{font:inherit;font-family:Manrope,Inter,sans-serif;font-weight:800;font-size:1.5rem;width:100%;min-height:200px;margin:8px 0;border-radius:24px;border:0;color:#fff;background:linear-gradient(180deg,#c9a25f,#8a6a2e);box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;transition:transform .12s}
.bigbtn:active{transform:scale(.98)}
.done{padding:14px 16px;border-radius:16px;background:rgba(47,143,99,.18);border:1px solid rgba(47,143,99,.6);color:#bfe9d5;font-weight:700;font-size:1rem;margin:0}
.note{margin:0;font-size:.82rem;color:var(--ink-soft)}
.err{margin:0;font-size:.9rem;color:#f0a98f;min-height:1.2em}
.recent{background:#1c1e22;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.recent h3{font-size:.85rem;margin:0;padding:12px 14px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.recent ul{list-style:none;margin:0;padding:0}
.recent li{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:.95rem}
.recent li:first-child{border-top:0}
.recent li span:last-child{color:var(--ink-soft);white-space:nowrap}
.empty{padding:14px;color:var(--ink-soft);font-size:.9rem;margin:0}
</style>
</head>
<body>
<header>
  <h1 id="title">Отметка работы</h1>
  <div class="hright">
    <nav class="lang" aria-label="Язык">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </nav>
    <button type="button" class="back" id="backBtn">Выйти</button>
  </div>
</header>

<main>
  <section class="card" id="loginView">
    <h2 id="loginTitle">Вход сотрудника</h2>
    <form id="loginForm" autocomplete="off" style="display:flex;flex-direction:column;gap:12px">
      <label><span id="emailLbl">E-mail</span><input id="email" type="email" autocomplete="username"></label>
      <label><span id="pwLbl">Пароль</span><input id="pw" type="password" autocomplete="new-password"></label>
      <label id="pw2wrap" hidden><span id="pw2Lbl">Повторите пароль</span><input id="pw2" type="password" autocomplete="new-password"></label>
      <p class="note" id="setupNote" hidden></p>
      <p class="err" id="loginErr" role="alert"></p>
      <button type="submit" class="btn" id="loginBtn">Войти</button>
    </form>
  </section>

  <section id="workView" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="who">
      <b id="wName"></b>
      <span id="wRole"></span>
    </div>
    <button type="button" class="bigbtn" id="scanBtn">Сканировать QR-код</button>
    <input type="file" id="photo" accept="image/*" capture="environment" hidden>
    <p class="done" id="done" role="status" hidden></p>
    <p class="err" id="err" role="alert"></p>
    <p class="note" id="note"></p>
    <section class="recent">
      <h3 id="mineTitle">Ваши отметки</h3>
      <ul id="list"></ul>
      <p class="empty" id="empty"></p>
    </section>
  </section>
</main>

<script>
(function () {
  var DICT = {
    ru: { title: "Отметка работы", loginTitle: "Вход сотрудника", email: "E-mail", pw: "Пароль", pw2: "Повторите пароль",
          login: "Войти", save: "Сохранить пароль", setupNote: "Первый вход: придумайте свой пароль (минимум 8 символов).",
          noAccount: "Такого сотрудника нет. Обратитесь к администратору.", wrong: "Неверный пароль.",
          short: "Минимум 8 символов.", mismatch: "Пароли не совпадают.", scan: "Сканировать QR-код",
          done: "Отмечено", mine: "Ваши отметки", none: "Пока нет отметок", back: "Выйти", backLogin: "На главную",
          note: "В превью QR-код не читается: отмечается сам снимок.", fail: "Этот браузер не сохраняет отметки." },
    fr: { title: "Pointage du travail", loginTitle: "Connexion employé", email: "E-mail", pw: "Mot de passe", pw2: "Répétez le mot de passe",
          login: "Se connecter", save: "Enregistrer le mot de passe", setupNote: "Première connexion : choisissez votre mot de passe (8 caractères minimum).",
          noAccount: "Aucun employé avec cet e-mail. Contactez l’administrateur.", wrong: "Mot de passe incorrect.",
          short: "8 caractères minimum.", mismatch: "Les mots de passe ne correspondent pas.", scan: "Scanner le QR-code",
          done: "Pointé", mine: "Vos pointages", none: "Aucun pointage pour l’instant", back: "Quitter", backLogin: "Accueil",
          note: "Dans l’aperçu, le QR n’est pas lu : la photo est enregistrée.", fail: "Ce navigateur ne garde pas les pointages." },
    en: { title: "Work check-in", loginTitle: "Employee sign-in", email: "E-mail", pw: "Password", pw2: "Repeat password",
          login: "Sign in", save: "Save password", setupNote: "First time: choose your password (at least 8 characters).",
          noAccount: "No employee with this e-mail. Contact the administrator.", wrong: "Wrong password.",
          short: "At least 8 characters.", mismatch: "Passwords do not match.", scan: "Scan QR code",
          done: "Checked in", mine: "Your check-ins", none: "No check-ins yet", back: "Sign out", backLogin: "Home",
          note: "In the preview the QR is not read: the photo itself is logged.", fail: "This browser does not keep check-ins." }
  };
  DICT.es = {
    title: "Registro de trabajo", loginTitle: "Acceso del empleado", email: "E-mail", pw: "Contraseña", pw2: "Repita la contraseña",
    login: "Entrar", save: "Guardar contraseña", setupNote: "Primera vez: elija su contraseña (mínimo 8 caracteres).",
    noAccount: "No hay ningún empleado con este e-mail. Consulte al administrador.", wrong: "Contraseña incorrecta.",
    short: "Mínimo 8 caracteres.", mismatch: "Las contraseñas no coinciden.", scan: "Escanear código QR",
    done: "Registrado", mine: "Sus registros", none: "Todavía no hay registros", back: "Salir", backLogin: "Inicio",
    note: "En la vista previa el QR no se lee: se registra la propia foto.", fail: "Este navegador no guarda los registros."
  };
  var LOG_KEY = "granite.log", STAFF_KEY = "granite.staff", PW_KEY = "granite.workerpw";
  var lang = "ru";
  try { var sl = localStorage.getItem("granite.lang"); if (DICT[sl]) lang = sl; } catch (e) {}
  var setupMode = false;
  var me = null;   // { name, role, email } после входа

  function store(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch (e) { return fallback; }
  }
  function findStaff(email) {
    var list = store(STAFF_KEY, []);
    for (var i = 0; i < list.length; i++) {
      if ((list[i][2] || "").toLowerCase() === email) return { name: list[i][0], role: list[i][1], email: email };
    }
    return null;
  }
  // Passwords: PBKDF2-SHA-256 with 310000 rounds (v:2). Older SHA-256 entries are checked once and upgraded.
  function hashPwLegacy(salt, pw) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw)).then(hexOf);
  }
  function hashPw(salt, pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]).then(function (key) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode(salt), iterations: 310000 }, key, 256);
    }).then(hexOf);
  }
  function hexOf(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, "0"); }).join(""); }
  function randomSalt() {
    var a = new Uint8Array(16);
    crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  function fmt(iso) {
    var locale = lang === "ru" ? "ru-RU" : lang === "fr" ? "fr-CA" : lang === "es" ? "es-ES" : "en-CA";
    return new Date(iso).toLocaleString(locale, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function renderLang() {
    var T = DICT[lang];
    document.documentElement.lang = lang;
    document.getElementById("title").textContent = T.title;
    document.getElementById("loginTitle").textContent = T.loginTitle;
    document.getElementById("emailLbl").textContent = T.email;
    document.getElementById("pwLbl").textContent = T.pw;
    document.getElementById("pw2Lbl").textContent = T.pw2;
    document.getElementById("loginBtn").textContent = setupMode ? T.save : T.login;
    document.getElementById("setupNote").textContent = T.setupNote;
    document.getElementById("scanBtn").textContent = T.scan;
    document.getElementById("note").textContent = T.note;
    document.getElementById("mineTitle").textContent = T.mine;
    document.getElementById("empty").textContent = T.none;
    document.getElementById("backBtn").textContent = me ? T.back : T.backLogin;
    Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    if (me) renderWork();
  }

  function renderWork() {
    document.getElementById("wName").textContent = me.name;
    document.getElementById("wRole").textContent = me.role;
    var list = document.getElementById("list");
    list.innerHTML = "";
    var mine = store(LOG_KEY, []).filter(function (e) { return e.name === me.name; }).slice(-5).reverse();
    mine.forEach(function (e) {
      var li = document.createElement("li");
      var a = document.createElement("span"); a.textContent = e.role;
      var t = document.createElement("span"); t.textContent = fmt(e.time);
      li.appendChild(a); li.appendChild(t);
      list.appendChild(li);
    });
    document.getElementById("empty").hidden = mine.length > 0;
  }

  function showWork() {
    document.getElementById("loginView").hidden = true;
    document.getElementById("workView").hidden = false;
    renderLang();
  }
  function showLogin() {
    me = null;
    try { sessionStorage.removeItem("granite.worker"); } catch (e) {}
    setupMode = false;
    document.getElementById("pw2wrap").hidden = true;
    document.getElementById("setupNote").hidden = true;
    document.getElementById("pw").value = "";
    document.getElementById("pw2").value = "";
    document.getElementById("loginErr").textContent = "";
    document.getElementById("workView").hidden = true;
    document.getElementById("loginView").hidden = false;
    renderLang();
  }
  function enter(person) {
    me = person;
    try { sessionStorage.setItem("granite.worker", person.email); } catch (e) {}
    showWork();
  }

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    // Старый вход с самостоятельным паролем отключён: вход по разделам — на главной (временный пароль от админа)
    window.location.href = "index.html"; return;
    var T = DICT[lang];
    var err = document.getElementById("loginErr");
    var email = document.getElementById("email").value.trim().toLowerCase();
    var pw = document.getElementById("pw").value;
    var person = findStaff(email);
    err.textContent = "";
    if (!person) { err.textContent = T.noAccount; return; }
    var pws = store(PW_KEY, {});
    if (!pws[email]) {
      // Первый вход: сотрудник сам придумывает пароль
      if (!setupMode) {
        setupMode = true;
        document.getElementById("pw2wrap").hidden = false;
        document.getElementById("setupNote").hidden = false;
        renderLang();
        return;
      }
      var pw2 = document.getElementById("pw2").value;
      if (pw.length < 8) { err.textContent = T.short; return; }
      if (pw !== pw2) { err.textContent = T.mismatch; return; }
      var salt = randomSalt();
      hashPw(salt, pw).then(function (h) {
        pws[email] = { v: 2, salt: salt, hash: h };
        try { localStorage.setItem(PW_KEY, JSON.stringify(pws)); } catch (e) {}
        enter(person);
      });
      return;
    }
    var rec = pws[email];
    (rec.v === 2 ? hashPw(rec.salt, pw) : hashPwLegacy(rec.salt, pw)).then(function (h) {
      if (h !== rec.hash) { err.textContent = T.wrong; document.getElementById("pw").value = ""; return; }
      if (rec.v === 2) { enter(person); return; }
      var ns = randomSalt();
      hashPw(ns, pw).then(function (nh) {
        pws[email] = { v: 2, salt: ns, hash: nh };
        try { localStorage.setItem(PW_KEY, JSON.stringify(pws)); } catch (e) {}
        enter(person);
      });
    });
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    window.location.href = "app.html?s=shop";
  });

  var photo = document.getElementById("photo");
  document.getElementById("scanBtn").addEventListener("click", function () {
    document.getElementById("err").textContent = "";
    photo.click();
  });
  photo.addEventListener("change", function () {
    var f = photo.files && photo.files[0];
    photo.value = "";
    if (!f || !me) return;
    var entry = { name: me.name, role: me.role, time: new Date().toISOString() };
    var log = store(LOG_KEY, []);
    log.push(entry);
    var kept = log.slice(-200);
    var ok = false;
    try {
      localStorage.setItem(LOG_KEY, JSON.stringify(kept));
      ok = JSON.stringify(store(LOG_KEY, [])).length > 2;
    } catch (e) { ok = false; }
    var done = document.getElementById("done");
    if (!ok) { document.getElementById("err").textContent = DICT[lang].fail; done.hidden = true; return; }
    done.textContent = DICT[lang].done + ": " + me.name + " · " + me.role + " · " + fmt(entry.time);
    done.hidden = false;
    renderWork();
  });

  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      if (me && me.admin) me.name = ADMIN_NAME[lang] || ADMIN_NAME.ru;
      try { localStorage.setItem("granite.lang", lang); } catch (e) {}
      document.getElementById("done").hidden = true;
      renderLang();
    });
  });

  // Если сотрудник уже вошёл в этой вкладке, восстанавливаем его
  var ADMIN_NAME = { ru: "Админ", fr: "Admin", en: "Admin", es: "Admin" };
  var ses = window.SlabAuth && window.SlabAuth.session();
  var restored = ses && ses.email && !ses.admin ? { name: ses.name || ses.email, role: ses.position || "", email: ses.email } : null;
  if (restored) { me = restored; showWork(); }
  else if (ses && ses.admin) { me = { name: ADMIN_NAME[lang] || ADMIN_NAME.ru, role: "", email: "", admin: true }; showWork(); }
  else { window.location.href = "index.html"; }
  window.addEventListener("slab:data", function () { if (me) renderWork(); });
  if (window.SlabCloud) window.SlabCloud.start().catch(function () {});
})();
</script>
</body>
</html>
